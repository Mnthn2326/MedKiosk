<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 680" width="540" height="680" fill="none">
  <defs>
    <!-- Card Shadow -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F4C5C" flood-opacity="0.12"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F4C5C" flood-opacity="0.06"/>
    </filter>
    
    <!-- Top Accent Gradient -->
    <linearGradient id="brandBar" x1="0" y1="0" x2="540" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F4C5C"/>
      <stop offset="50%" stop-color="#1B8A5A"/>
      <stop offset="100%" stop-color="#D85A30"/>
    </linearGradient>

    <!-- Badge Radial Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </radialGradient>
  </defs>

  <style>
    .font-inter { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>

  <!-- Background Canvas -->
  <rect width="540" height="680" rx="32" fill="#F8FAFC"/>

  <!-- Main Presentation Card -->
  <g filter="url(#cardShadow)">
    <rect x="30" y="30" width="480" height="620" rx="24" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  </g>

  <!-- Top Accent Bar -->
  <path d="M 30 54 A 24 24 0 0 1 54 30 L 486 30 A 24 24 0 0 1 510 54 L 510 38 L 30 38 Z" fill="url(#brandBar)"/>

  <!-- Header: Brand Logo & Title -->
  <g transform="translate(60, 64)">
    <!-- Icon Tile -->
    <rect width="48" height="48" rx="14" fill="#0F4C5C"/>
    <!-- Medical Cross -->
    <path d="M 24 14 L 24 34 M 14 24 L 34 24" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Brand Typography -->
    <text x="62" y="30" class="font-inter" font-size="24" font-weight="800" fill="#0F4C5C">MediKiosk<tspan fill="#D85A30">+</tspan></text>
    <text x="62" y="46" class="font-inter" font-size="12" font-weight="500" fill="#64748B">Clinical Core • FinHealth • Emergency</text>

    <!-- Status Pill -->
    <rect x="330" y="10" width="90" height="26" rx="13" fill="#D1FAE5" stroke="#1B8A5A" stroke-opacity="0.3" stroke-width="1"/>
    <circle cx="344" cy="23" r="3.5" fill="#1B8A5A"/>
    <text x="354" y="27" class="font-inter" font-size="11" font-weight="600" fill="#064E3B">LIVE DEMO</text>
  </g>

  <!-- QR Frame Outer Container -->
  <g transform="translate(85, 145)">
    <!-- Frame Surface -->
    <rect width="370" height="370" rx="22" fill="#E7EEF0" stroke="#0F4C5C" stroke-opacity="0.15" stroke-width="1.5"/>

    <!-- Corner Target Accents -->
    <path d="M 12 28 L 12 16 A 4 4 0 0 1 16 12 L 28 12" stroke="#0F4C5C" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 358 28 L 358 16 A 4 4 0 0 0 354 12 L 342 12" stroke="#0F4C5C" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 12 342 L 12 354 A 4 4 0 0 0 16 358 L 28 358" stroke="#0F4C5C" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 358 342 L 358 354 A 4 4 0 0 1 354 358 L 342 358" stroke="#0F4C5C" stroke-width="3" fill="none" stroke-linecap="round"/>

    <!-- QR Code Plate -->
    <rect x="25" y="25" width="320" height="320" rx="14" fill="#FFFFFF"/>

    <!-- Themed QR Code (Colors: Foreground #0F4C5C / Background White) -->
    <image x="35" y="35" width="300" height="300" href="https://api.qrserver.com/v1/create-qr-code/?size=450x450&amp;color=15-76-92&amp;bgcolor=255-255-255&amp;margin=8&amp;data=https%3A%2F%2Fmedkiosk.vercel.app%2Flogin" />

    <!-- Center Brand Badge with Medical Cross -->
    <g transform="translate(185, 185)">
      <circle r="26" fill="url(#centerGlow)" stroke="#E2E8F0" stroke-width="1.5"/>
      <circle r="21" fill="#0F4C5C"/>
      <path d="M 0 -10 L 0 10 M -10 0 L 10 0" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Instructions -->
  <text x="270" y="545" class="font-inter" text-anchor="middle" font-size="15" font-weight="700" fill="#1B2B2E">Scan to Launch Login Portal</text>
  <text x="270" y="567" class="font-inter" text-anchor="middle" font-size="12" font-weight="500" fill="#64748B">Instant access for Doctors, Patients &amp; Contributors</text>

  <!-- Footer URL Pill -->
  <g transform="translate(125, 590)">
    <rect width="290" height="36" rx="10" fill="#E7EEF0" stroke="#0F4C5C" stroke-opacity="0.2" stroke-width="1"/>
    <text x="20" y="23" class="font-inter" font-size="12" font-family="monospace" font-weight="600" fill="#0F4C5C">https://medkiosk.vercel.app/login</text>
    <!-- Arrow Icon -->
    <path d="M 264 14 L 272 14 M 272 14 L 272 22 M 272 14 L 263 23" stroke="#0F4C5C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
